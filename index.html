<!doctype html>
<html lang="ro" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Catedra">
<meta name="theme-color" content="#0B0C10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Catedra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{
  --bg:#0B0C10;--card:#15171D;--card2:#1C1F26;--card3:#262932;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --tx:#F2F3F5;--tx2:#C4C8D0;--tx3:#9BA1AD;--tx4:#6F7582;--nav:rgba(15,16,21,.84);--shadow:0 18px 50px rgba(0,0,0,.55);
  --ac:#8B9CFF;--acs:rgba(139,156,255,.14);--onac:#0B0C10;--warn:#FFB067;
  --serif:'Instrument Serif',ui-serif,Georgia,serif;--sans:Inter,-apple-system,system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
[data-theme=light]{
  --bg:#F3F3F6;--card:#FFFFFF;--card2:#F0F1F4;--card3:#E3E5EA;--line:rgba(10,12,20,.07);--line2:rgba(10,12,20,.12);
  --tx:#111318;--tx2:#33373F;--tx3:#5C626D;--tx4:#80868F;--nav:rgba(255,255,255,.86);--shadow:0 18px 50px rgba(20,24,40,.16);--warn:#B85A00;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ac)}
.tnum{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif);font-weight:400}

/* Layout */
#app{display:flex;min-height:100dvh}
#main{flex:1;min-width:0;padding:calc(var(--st) + 22px) 20px calc(var(--sb) + 110px)}
.wrap{max-width:1120px;margin:0 auto}
.view{animation:vin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}

/* Header */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:4px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--tx3);text-transform:uppercase}
h1.title{margin:4px 0 0;font-family:var(--serif);font-weight:400;font-size:40px;line-height:1.05;letter-spacing:-.01em}
.round{width:44px;height:44px;border-radius:22px;border:1px solid var(--line2);background:var(--card2);display:flex;align-items:center;justify-content:center;padding:0;flex:none;font-weight:600;font-size:14px}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px 20px}
.card.hero{border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:16px}
.sec{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--tx3);text-transform:uppercase;margin:6px 0 2px}
.muted{color:var(--tx3)}.dim{color:var(--tx4)}
.tag{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--acs);color:var(--ac);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tag i{width:7px;height:7px;border-radius:4px;background:var(--ac);display:block}
.tag.live i{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.bar{height:6px;border-radius:3px;background:var(--card3);overflow:hidden}
.bar>div{height:100%;border-radius:3px;background:var(--ac);transition:width .6s}
.big{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.stat b{display:block;font-size:22px;font-weight:600}
.stat b span{color:var(--tx4);font-weight:500}
.stat small{font-size:12px;color:var(--tx3)}

/* Buttons */
.btn{height:48px;border:1px solid var(--line2);border-radius:16px;background:var(--card2);font-size:15px;font-weight:600;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--ac);color:var(--onac);border-color:transparent}
.btn.sm{height:38px;border-radius:12px;font-size:14px;padding:0 14px}
.btn.danger{color:#FF6B6B}
.btn:active,.chip:active,.li:active,.key:active{transform:scale(.97)}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fab{position:fixed;right:20px;bottom:calc(var(--sb) + 98px);height:56px;padding:0 22px 0 18px;border:0;border-radius:28px;background:var(--ac);color:var(--onac);display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;box-shadow:var(--shadow);z-index:20}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--tx2);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip.on{background:var(--tx);color:var(--bg);border-color:transparent}
.chip .dot{width:8px;height:8px;border-radius:4px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:4px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.seg button{height:36px;border:0;border-radius:10px;background:transparent;color:var(--tx3);font-size:14px;font-weight:600}
.seg button.on{background:var(--card3);color:var(--tx)}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 0;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.av{width:36px;height:36px;flex:none;border-radius:18px;background:var(--card3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--tx2)}
.gchips{display:flex;gap:4px;flex-wrap:wrap}
.g{min-width:22px;height:20px;padding:0 5px;border-radius:6px;background:var(--card3);font-size:12px;font-weight:600;color:var(--tx2);display:inline-flex;align-items:center;justify-content:center}
.g.low{color:var(--warn)}
.nm{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--tx3);margin-top:3px}
.rv{font-size:20px;font-weight:600}
.pill{padding:4px 10px;border-radius:999px;background:var(--card3);font-size:12px;font-weight:600;color:var(--tx2);white-space:nowrap}

/* Schedule rows */
.sched .li{min-height:48px;gap:14px}
.sched .t{width:44px;font-size:13px;color:var(--tx3)}
.sched .done{color:var(--tx4)}
.sched .now{background:var(--acs);border-radius:14px;margin:2px -12px;padding:6px 12px;border-bottom:0;width:calc(100% + 24px)}
.sched .now .t{color:var(--ac);font-weight:600}
.mark{width:16px;display:flex;justify-content:center;flex:none}
.mark i{width:8px;height:8px;border-radius:4px;background:var(--tx4);display:block}
.mark i.o{background:transparent;border:1.5px solid var(--tx4)}

/* Events */
.ev{display:flex;gap:12px;align-items:stretch;padding:10px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.ev:last-child{border-bottom:0}
.ev .stripe{width:4px;border-radius:2px;flex:none}
.ev .when{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}

[data-theme=light] .ev .when{color:var(--tx2)!important}
/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;font-weight:700;color:var(--tx4);text-align:center;padding:4px 0;letter-spacing:.04em}
.day{position:relative;aspect-ratio:1/1.08;border:0;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7px;gap:4px;font-size:15px;font-weight:500;color:var(--tx)}
.day.out{opacity:.28}
.day.we{color:var(--tx4)}
.day.vac{background:rgba(91,211,138,.10);color:var(--tx2)}
.day.free{background:rgba(91,211,138,.18)}
.day.sel{box-shadow:inset 0 0 0 2px var(--ac)}
.day.today span{background:var(--ac);color:var(--onac);border-radius:9px;padding:0 6px;font-weight:700}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:3px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--tx3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}

/* Timetable */
.tt{display:none}
.slot{display:flex;align-items:center;gap:14px;min-height:60px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;padding:8px 0}
.slot .cbar{width:4px;align-self:stretch;border-radius:2px;flex:none}
.slot.vacant .grow{color:var(--tx4)}
.ttg{display:grid;grid-template-columns:64px repeat(5,minmax(0,1fr));gap:6px}
.ttg .h{font-size:12px;color:var(--tx3);padding:8px 0}
.ttg .c{min-height:64px;border-radius:14px;border:1px dashed var(--line2);background:transparent;text-align:left;padding:8px 10px;font-size:13px}
.ttg .c.f{border:0;background:var(--card)}

/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:8px 8px calc(var(--sb) + 6px);background:var(--nav);border-top:1px solid var(--line);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;height:50px;color:var(--tx3);font-size:11px;font-weight:500}
nav.tabs button.on{color:var(--ac);font-weight:600}
nav .brand{display:none}

/* Sheet */
#sheet{position:fixed;inset:0;z-index:50;pointer-events:none}
#sheet.open{pointer-events:auto}
.sbg{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .25s}
#sheet.open .sbg{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90dvh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:10px 20px calc(var(--sb) + 24px);transform:translateY(100%);transition:transform .34s cubic-bezier(.2,.9,.2,1);border-top:1px solid var(--line2)}
#sheet.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--card3);margin:0 auto 14px}
.sheet h2{margin:0;font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.1}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label,.lbl{font-size:12px;font-weight:600;color:var(--tx3);letter-spacing:.04em;text-transform:uppercase}
.in{height:48px;border-radius:14px;border:1px solid var(--line2);background:var(--card2);padding:0 14px;font-size:16px;width:100%;outline:none}
textarea.in{height:auto;min-height:110px;padding:12px 14px;resize:vertical}
.in:focus{border-color:var(--ac)}
select.in{appearance:none;-webkit-appearance:none}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.keys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.key{height:56px;border-radius:16px;border:1px solid var(--line2);background:var(--card2);font-size:22px;font-weight:600}
.key.low{color:var(--warn)}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw label{position:relative}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw span{display:block;width:36px;height:36px;border-radius:18px;border:3px solid transparent}
.sw input:checked+span{box-shadow:0 0 0 2px var(--tx)}
.ck{display:flex;flex-wrap:wrap;gap:8px}
.ck label{position:relative}
.ck input{position:absolute;opacity:0;pointer-events:none}
.ck span{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);font-size:14px;font-weight:600;color:var(--tx2)}
.ck input:checked+span{background:var(--tx);color:var(--bg);border-color:transparent}
.ck input:focus-visible+span,.sw input:focus-visible+span{outline:2px solid var(--ac);outline-offset:2px}
.toggle{width:52px;height:32px;border-radius:16px;border:0;background:var(--card3);position:relative;flex:none;padding:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle[aria-pressed=true]{background:var(--ac)}
.toggle[aria-pressed=true]::after{transform:translateX(20px)}
.att{display:flex;align-items:center;gap:12px;min-height:56px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:6px 0}
.att .st{font-size:13px;font-weight:700;color:var(--tx4)}
.att[aria-pressed=true] .st{color:var(--warn)}
.att[aria-pressed=true] .av{background:rgba(255,176,103,.2);color:var(--warn)}

.pm{width:44px;height:44px;flex:none;border-radius:14px;border:1px solid var(--line2);background:var(--card2);font-size:24px;font-weight:600;line-height:1;padding:0}
.pm.plus{color:#5BD38A}.pm.minus{color:var(--warn)}
.nb{display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:0;min-width:0}
nav.tabs button.wide{display:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line2);background:var(--card3);padding:0;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--tx3);font-size:11px;font-weight:600;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.missing::after{content:"?";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--tx4);font-size:18px}
.thumb.add{border-style:dashed;color:var(--ac);background:transparent}
.stchip{flex:none;height:34px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,176,103,.45);background:rgba(255,176,103,.12);color:var(--warn);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.stchip.ok{border-color:transparent;background:var(--card3);color:var(--tx3)}
#viewer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:calc(var(--st) + 60px) 12px calc(var(--sb) + 20px)}
#viewer.open{display:flex}
#viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
#viewer .vbar{position:absolute;top:calc(var(--st) + 12px);right:12px;left:12px;display:flex;justify-content:flex-end;gap:10px;align-items:center}
#viewer .round{background:rgba(255,255,255,.12);color:#fff;border-color:transparent}
#viewer .btn{background:rgba(255,255,255,.12);color:#fff;border-color:transparent;text-decoration:none}
/* Settings */
.set .li{min-height:52px}
.set .ico{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.empty{text-align:center;padding:28px 20px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{margin:0;color:var(--tx3);font-size:14px;line-height:1.5;max-width:320px}

#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 104px);transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* Desktop */
.only-wide{display:none}
@media (min-width:900px){
  #main{padding:40px 40px 60px;margin-left:240px}
  nav.tabs{top:0;right:auto;width:240px;bottom:0;display:flex;flex-direction:column;gap:4px;padding:28px 14px;border-top:0;border-right:1px solid var(--line)}
  nav .brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px;font-family:var(--serif);font-size:28px}
  nav .brand img{width:34px;height:34px;border-radius:9px}
  nav.tabs button{flex-direction:row;height:46px;padding:0 14px;gap:12px;font-size:15px;border-radius:12px;justify-content:flex-start}
  nav.tabs button.on{background:var(--acs)}
  .cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  .cols.c3{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}
  .fab{bottom:32px;right:40px}
  #toast{bottom:40px}
  .sheet{left:50%;right:auto;bottom:50%;width:520px;border-radius:28px;transform:translate(-50%,60%);opacity:0;transition:transform .3s,opacity .2s;border:1px solid var(--line2);max-height:86vh}
  #sheet.open .sheet{transform:translate(-50%,50%);opacity:1}
  .grab{display:none}
  .chips{margin:0;padding:2px 0;flex-wrap:wrap}
  .tt{display:block}.tm{display:none}
  nav.tabs button.wide{display:flex}
  .only-wide{display:block}
  h1.title{font-size:48px}
}
</style>
</head>
<body>
<div id="app">
  <nav class="tabs" aria-label="Navigare" id="nav"></nav>
  <main id="main"><div class="wrap" id="view"></div></main>
</div>
<div id="sheet" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="viewer" role="dialog" aria-modal="true" aria-label="Document"></div>
<script>
'use strict';
/* ---------- utilitare ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const dow=s=>{const x=parse(s).getDay();return x===0?7:x};
const monday=s=>addDays(s,1-dow(s));
const LUNI=['ianuarie','februarie','martie','aprilie','mai','iunie','iulie','august','septembrie','octombrie','noiembrie','decembrie'];
const LUNI_S=['ian','feb','mar','apr','mai','iun','iul','aug','sep','oct','nov','dec'];
const ZILE=['','Luni','Marți','Miercuri','Joi','Vineri','Sâmbătă','Duminică'];
const ZS=['','L','Ma','Mi','J','V','S','D'];
const fmtD=(s,y)=>{const d=parse(s);return `${d.getDate()} ${LUNI[d.getMonth()]}${y?' '+d.getFullYear():''}`};
const fmtDs=s=>{const d=parse(s);return `${d.getDate()} ${LUNI_S[d.getMonth()]}`};
const fmtR=(a,b)=>b&&b!==a?`${fmtD(a)} – ${fmtD(b)}`:fmtD(a);
const n2=x=>x.toFixed(2).replace('.',',');
const fmtT=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const inR=(d,p)=>d>=p.start&&d<=(p.end||p.start);
const plural=(n,one,many)=>n===1?`1 ${one}`:`${n} ${n%100>=20||(n>0&&n%100===0)?'de ':''}${many}`;
const TQ=new URLSearchParams(location.search).get('t');const T0=Date.now();
const NOW=()=>TQ?new Date(new Date(TQ).getTime()+(Date.now()-T0)):new Date();
const today=()=>iso(NOW());
const nowMin=()=>{const d=NOW();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60};

const P={

const live=c=>S[c].filter(x=>!x.deleted);
const byId=(c,id)=>S[c].find(x=>x.id===id&&!x.deleted);
function upsert(c,o){o.updatedAt=Date.now();const i=S[c].findIndex(x=>x.id===o.id);if(i<0)S[c].push(o);else S[c][i]=o;save();return o}
function del(c,id){const o=S[c].find(x=>x.id===id);if(o){o.deleted=true;o.updatedAt=Date.now();save()}}

/* ---------- an școlar ---------- */
const periods=k=>live('periods').filter(p=>!k||p.kind===k).sort((a,b)=>a.start<b.start?-1:1);
const modules=()=>periods('module');
function dayInfo(d){
  const vac=periods('vacation').find(p=>inR(d,p));if(vac)return{kind:'vacation',p:vac};
  const fr=periods('free').find(p=>inR(d,p));if(fr)return{kind:'free',p:fr};
  const fe=live('events').find(e=>e.type==='liber'&&inR(d,e));if(fe)return{kind:'free',p:{name:fe.title}};
  if(dow(d)>5)return{kind:'weekend'};
  const m=modules().find(p=>inR(d,p));if(m)return{kind:'school',p:m};
  return{kind:'out'};
}
function weekInfo(d){
  const set=new Set();for(const m of modules()){for(let x=m.start;x<=m.end;x=addDays(x,1))if(dow(x)<=5)set.add(monday(x))}
  const all=[...set].sort();const mo=monday(d);const cur=all.filter(w=>w<=mo).length;
  return{cur,total:all.length,inSchool:all.includes(mo)};
}
function modOf(d){const ms=modules();return ms.find(m=>inR(d,m))||[...ms].reverse().find(m=>m.end<d)||ms[0]}
function nextVacation(d){return periods('vacation').find(p=>p.start>d)}
function bells(){
  const b=S.settings.bells;let[h,m]=b.start.split(':').map(Number);let t=h*60+m;const out=[];
  for(let i=1;i<=b.count;i++){out.push({n:i,s:t,e:t+ +b.len});t+= +b.len+(i=== +b.bigAfter? +b.bigLen: +b.brk)}return out;
}
function lessonsOn(d){
  if(dayInfo(d).kind!=='school')return[];const B=bells();
  return live('slots').filter(s=>s.day===dow(d)).map(s=>({...s,cls:byId('classes',s.classId),b:B[s.hour-1]}))
    .filter(s=>s.b&&(!s.cls||!s.cls.terminal||d<=TERMINAL_END)).sort((a,b)=>a.hour-b.hour);
}
function eventsOn(d){return live('events').filter(e=>inR(d,e)).sort((a,b)=>a.start<b.start?-1:1)}

/* ---------- catalog ---------- */
const studentsOf=cid=>live('students').filter(s=>s.classId===cid).sort((a,b)=>a.name.localeCompare(b.name,'ro'));
function inPeriod(d,per){if(per==='an')return true;const m=byId('periods',per);return m?inR(d,m):true}
function gradesOf(sid,per){return live('grades').filter(g=>g.studentId===sid&&inPeriod(g.date,per)).sort((a,b)=>a.date<b.date?-1:1)}
function absOf(sid,per,own){return live('absences').filter(a=>a.studentId===sid&&inPeriod(a.date,per)&&(!own||!a.subject)).sort((a,b)=>a.date>b.date?-1:1)}
const ptsOf=(sid,per)=>live('points').filter(p=>p.studentId===sid&&inPeriod(p.date,per)).sort((a,b)=>(a.date+a.updatedAt)<(b.date+b.updatedAt)?-1:1);
const unused=(ps,k)=>ps.filter(p=>!p.used&&p.k===k);
const homeroom=()=>live('classes').find(c=>c.homeroom);
function conductOf(s){const ec=S.ecat?.rows?.[s.id];const nem=S.ecat?(ec?ec.n:0):absOf(s.id,'an').filter(a=>!a.motivated).length;const thr=Math.max(1,+S.settings.dirThr||10);const auto=Math.max(1,10-Math.floor(nem/thr));return{auto,val:s.conduct||auto,manual:!!s.conduct,nem}}
const avg=gs=>gs.length?gs.reduce((s,g)=>s+ +g.value,0)/gs.length:null;
const initials=n=>n.trim().split(/\s+/).slice(0,2).map(p=>p[0]||'').join('').toUpperCase();

/* ---------- temă ---------- */
function applyTheme(){
  const t=S.settings.theme==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):S.settings.theme;
  document.documentElement.dataset.theme=t;
  const a=ACCENTS[S.settings.accent]||ACCENTS.indigo;const hex=t==='light'?a[1]:a[0];
  const n=parseInt(hex.slice(1),16);const r=document.documentElement.style;
  r.setProperty('--ac',hex);r.setProperty('--acs',`rgba(${n>>16&255},${n>>8&255},${n&255},${t==='light'?.12:.15})`);
  r.setProperty('--onac',t==='light'?'#FFFFFF':'#0B0C10');
  document.querySelector('meta[name=theme-color]').content=t==='light'?'#F3F3F6':'#0B0C10';
}
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>{if(S.settings.theme==='system'){applyTheme();}});

/* ---------- AZI ---------- */
function vAzi(){
  const d=today(),now=nowMin(),info=dayInfo(d),L=lessonsOn(d),h=NOW().getHours();
  const greet=(h<11?'Bună dimineața':h<18?'Bună ziua':'Bună seara')+(S.settings.name?', '+esc(S.settings.name.split(' ')[0]):'');
  const dt=parse(d);const eye=`${ZILE[dow(d)]} · ${dt.getDate()} ${LUNI[dt.getMonth()]}`;
  const right=`<button class="round" data-a="tab" data-t="set" aria-label="Setări">${S.settings.name?esc(initials(S.settings.name)):ic('user',20)}</button>`;
  let out=hdr(eye,greet,right);
  if(!live('classes').length){
    out+=`<div class="card empty"><div class="serif" style="font-size:28px">Să pregătim catedra</div><p>Adaugă clasele și elevii, apoi completează orarul. Structura anului școlar 2026–2027 este deja introdusă.</p>
    <div class="row" style="flex-wrap:wrap;justify-content:center"><button class="btn pri" data-a="classEdit">${ic('plus',20)} Adaugă o clasă</button><button class="btn" data-a="demo">Date de exemplu</button></div></div>`;
  }
  /* hero */
  let hero='';
  if(info.kind==='school'&&L.length){
    const cur=L.find(l=>now>=l.b.s&&now<l.b.e),nx=L.find(l=>l.b.s>now);
    const l=cur||nx;
    if(l){
      const c=l.cls;const subj=esc(l.subject||c?.subject||'Oră');const isCur=!!cur;
      const mins=Math.max(0,Math.ceil(isCur?l.b.e-now:l.b.s-now));const last=isCur&&L[L.length-1]===l;
      const pr=isCur?Math.min(100,(now-l.b.s)/(l.b.e-l.b.s)*100):0;
      const big=mins>=120?`${Math.floor(mins/60)}<span style="font-size:24px"> h </span>${mins%60}`:mins;
      hero=`<div class="card hero"><div class="row between"><span class="tag ${isCur?'live':''}"><i></i>${isCur?'Acum':'Urmează'} · ora ${l.hour}</span><span class="muted tnum" style="font-size:13px">${fmtT(l.b.s)} – ${fmtT(l.b.e)}</span></div>
      <div><div class="serif" style="font-size:32px;line-height:1.05">${subj}</div><div class="muted" style="font-size:14px;margin-top:4px">${c?esc(c.name):'—'}${l.room?' · '+esc(l.room):''}${c?' · '+plural(studentsOf(c.id).length,'elev','elevi'):''}</div></div>
      <div><div class="row" style="align-items:baseline;gap:8px"><div class="big tnum">${big}</div><div style="font-size:14px;color:var(--tx2)">${mins>=120?'':mins===1?'minut ':'minute '}${isCur?(last?'până la finalul orelor':'până la pauză'):'până începe ora'}</div></div>
      ${isCur?`<div class="bar" style="margin-top:10px"><div style="width:${pr.toFixed(1)}%"></div></div>`:''}</div>
      ${c?`<div class="btns"><button class="btn pri" data-a="attend" data-c="${c.id}" data-h="${l.hour}">${ic('check',20,2.4)} Prezența</button><button class="btn" data-a="pickStudent" data-c="${c.id}">Notă rapidă</button></div>`:''}</div>`;
    }else{
      hero=`<div class="card hero"><span class="tag" style="align-self:flex-start"><i></i>Gata pe azi</span><div class="serif" style="font-size:30px;line-height:1.1">Ai terminat cele ${L.length} ${L.length===1?'oră':'ore'} de azi.</div>${nextDayLine(d)}</div>`;
    }
  }else if(info.kind==='vacation'){
    const back=addDays(info.p.end,1);const n=diffDays(d,back);
    hero=`<div class="card hero"><span class="tag" style="align-self:flex-start;background:rgba(91,211,138,.15);color:#5BD38A"><i style="background:#5BD38A"></i>Vacanță</span><div class="serif" style="font-size:34px;line-height:1.05">${esc(info.p.name)}</div><div class="row" style="align-items:baseline;gap:8px"><div class="big tnum">${n}</div><div style="color:var(--tx2);font-size:14px">${n===1?'zi':'zile'} până revenim · ${ZILE[dow(back)].toLowerCase()}, ${fmtD(back)}</div></div></div>`;
  }else if(info.kind==='free'){
    hero=`<div class="card hero"><span class="tag" style="align-self:flex-start;background:rgba(91,211,138,.15);color:#5BD38A"><i style="background:#5BD38A"></i>Zi liberă</span><div class="serif" style="font-size:34px;line-height:1.05">${esc(info.p.name)}</div>${nextDayLine(d)}</div>`;
  }else if(info.kind==='weekend'){
    hero=`<div class="card hero"><span class="tag" style="align-self:flex-start"><i></i>Weekend</span><div class="serif" style="font-size:34px;line-height:1.05">Odihnă plăcută.</div>${nextDayLine(d)}</div>`;
  }else if(live('classes').length){
    hero=`<div class="card hero"><span class="tag" style="align-self:flex-start"><i></i>Nicio oră azi</span>${nextDayLine(d)}</div>`;
  }
  const W=weekInfo(d);const nv=nextVacation(d);const nvd=nv?diffDays(d,nv.start):null;
  const stats=`<div class="stats"><div class="stat"><b class="tnum">${W.cur}<span> / ${W.total}</span></b><small>săptămâni de cursuri</small></div>
   <div class="stat"><b class="tnum">${nv?nvd:'—'}<span> ${nvd===1?'zi':'zile'}</span></b><small>${nv?'până la '+esc(nv.name.toLowerCase()):'fără vacanțe următoare'}</small></div></div>`;
  /* program */
  let sched='';
  if(L.length){
    sched=`<div><div class="sec">Programul de azi</div><div class="list sched">`+L.map(l=>{
      const st=now>=l.b.e?'done':now>=l.b.s?'now':'';const c=l.cls;
      return `<button class="li ${st}" data-a="slot" data-d="${l.day}" data-h="${l.hour}"><div class="t tnum">${fmtT(l.b.s)}</div>
      <div class="mark">${st==='done'?`<span class="dim">${ic('check',16,2.6)}</span>`:`<i style="${st==='now'?'background:var(--ac)':c?`background:${c.color}`:''}"></i>`}</div>
      <div class="grow" style="font-size:15px;${st==='now'?'font-weight:600':''}" >${esc(l.subject||c?.subject||'Oră')}</div>
      ${c?`<span class="pill" style="${st==='now'?'background:var(--ac);color:var(--onac)':''}">${esc(c.name)}</span>`:''}</button>`}).join('')+`</div></div>`;
  }
  const up=live('events').filter(e=>(e.end||e.start)>=d&&e.start<=addDays(d,45)).sort((a,b)=>a.start<b.start?-1:1).slice(0,6);
  const evs=`<div><div class="row between"><div class="sec">Urmează</div><button class="btn sm" data-a="eventEdit" data-date="${d}" style="height:32px">${ic('plus',16)} Eveniment</button></div>

/* ---------- CALENDAR ---------- */
function vCal(){
  const [y,m]=ui.cal.split('-').map(Number);const first=`${y}-${pad(m)}-01`;const start=monday(first);
  const d0=today();const f=ui.calF;
  const evs=live('events').filter(e=>f==='all'||e.type===f||(f==='concurs'&&e.type==='olimpiada'));
  let cells='';
  for(let i=0;i<42;i++){
    const x=addDays(start,i);const inM=x.slice(0,7)===ui.cal;const info=dayInfo(x);
    const de=evs.filter(e=>inR(x,e));
    const cls=['day',inM?'':'out',info.kind==='vacation'?'vac':'',info.kind==='free'?'free':'',info.kind==='weekend'?'we':'',x===ui.sel?'sel':'',x===d0?'today':''].join(' ');
    cells+=`<button class="${cls}" data-a="selDay" data-d="${x}" aria-label="${fmtD(x,true)}"><span class="tnum">${parse(x).getDate()}</span><div class="dots">${de.slice(0,3).map(e=>`<i style="background:${tclr(e.type)}"></i>`).join('')}</div></button>`;
    if(i===34&&addDays(start,35).slice(0,7)!==ui.cal)break;
  }
  const ms=modules().filter(p=>p.start.slice(0,7)<=ui.cal&&p.end.slice(0,7)>=ui.cal).map(p=>p.name).join(' · ');
  const fil=[['all','Toate'],['practica','Practică'],['simulare','Simulări'],['examen','Examene'],['concurs','Concursuri'],['sedinta','Ședințe'],['altfel','Școala altfel'],['liber','Zile libere'],['eveniment','Evenimente']];

  /* zi selectată */
  const sd=ui.sel;const info=dayInfo(sd);const de=evs.filter(e=>inR(sd,e));const L=lessonsOn(sd);
  const status={school:`Zi de curs · ${esc(info.p?.name||'')}`,vacation:esc(info.p?.name||'Vacanță'),free:'Zi liberă · '+esc(info.p?.name||''),weekend:'Weekend',out:'În afara anului școlar'}[info.kind];
  const dayBox=`<div class="card"><div class="row between"><div><div class="eyebrow">${ZILE[dow(sd)]}</div><div class="serif" style="font-size:28px">${fmtD(sd,true)}</div></div>
    <button class="round" data-a="eventEdit" data-date="${sd}" aria-label="Adaugă eveniment">${ic('plus',20)}</button></div>
    <div class="muted" style="font-size:14px;margin:6px 0 4px">${status}</div>

    ${L.length?`<div class="sec" style="margin-top:12px">Ore</div><div class="list sched">${L.map(l=>`<div class="li" style="min-height:42px"><div class="t tnum">${fmtT(l.b.s)}</div><div class="mark"><i style="${l.cls?`background:${l.cls.color}`:''}"></i></div><div class="grow" style="font-size:14px">${esc(l.subject||l.cls?.subject||'')}</div>${l.cls?`<span class="pill">${esc(l.cls.name)}</span>`:''}</div>`).join('')}</div>`:''}
    ${!de.length&&!L.length?'<p class="dim" style="font-size:14px;margin:6px 0 0">Nimic programat.</p>':''}</div>`;
  const up=evs.filter(e=>(e.end||e.start)>=d0).sort((a,b)=>a.start<b.start?-1:1).slice(0,12);
  const agenda=`<div><div class="sec">Următoarele</div>${up.length?`<div class="list">${up.map(e=>evRow(e,d0)).join('')}</div>`:'<p class="muted" style="font-size:14px">Niciun eveniment viitor.</p>'}</div>`;

   `<div class="stack" style="margin-top:14px">${chips}<div class="cols c3"><div class="stack"><div class="card" style="padding:14px 12px"><div class="cal">${[1,2,3,4,5,6,7].map(i=>`<div class="wd">${ZS[i]}</div>`).join('')}${cells}</div></div>

async function fileURL(f){
  if(urlCache.has(f.id))return urlCache.get(f.id);
  let rec=await IDB.get(f.id);
  if(!rec&&SY.token&&SY.owner){try{const r=await fetch(ghUrl(fpath(f)),{headers:{...ghH(),Accept:'application/vnd.github.raw'},cache:'no-store'});if(r.ok){const b=await r.blob();rec={blob:new Blob([b],{type:f.type}),type:f.type};await IDB.set(f.id,rec)}}catch(e){}}
  if(!rec)return null;const u=URL.createObjectURL(rec.blob.type?rec.blob:new Blob([rec.blob],{type:f.type}));urlCache.set(f.id,u);return u;
}
function hydrate(){document.querySelectorAll('img[data-fid]:not([data-h])').forEach(async el=>{el.dataset.h='1';const u=await fileURL({id:el.dataset.fid,ext:el.dataset.ext,type:el.dataset.type});if(u)el.src=u;else el.parentElement.classList.add('missing')})}
async function uploadPending(){
  if(!PEND.length)return;
  for(const f of [...PEND]){const rec=await IDB.get(f.id);if(!rec){PEND=PEND.filter(x=>x.id!==f.id);continue}
    const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.readAsDataURL(rec.blob)});
    const p=await fetch(ghUrl(fpath(f)),{method:'PUT',headers:{...ghH(),'Content-Type':'application/json'},body:JSON.stringify({message:`Catedra · fișier ${f.id}`,content:b64})});
    if(p.ok||p.status===422){PEND=PEND.filter(x=>x.id!==f.id);savePend()}else break}
}
async function removeFiles(files){
  for(const f of files||[]){IDB.del(f.id);PEND=PEND.filter(x=>x.id!==f.id);savePend();
    if(SY.token&&SY.owner){try{const r=await fetch(ghUrl(fpath(f)),{headers:ghH()});if(r.ok){const j=await r.json();await fetch(ghUrl(fpath(f)),{method:'DELETE',headers:{...ghH(),'Content-Type':'application/json'},body:JSON.stringify({message:'Catedra · șterge fișier',sha:j.sha})})}}catch(e){}}}
}
async function viewFile(f){
  const u=await fileURL(f);if(!u){toast(SY.token?'Fișierul nu a putut fi descărcat':'Fișierul nu este pe acest dispozitiv');return}
  if(f.ext==='pdf'){window.open(u,'_blank');return}
  const v=$('#viewer');v.innerHTML=`<img src="${u}" alt="Document"><div class="vbar"><a class="btn sm" href="${u}" target="_blank" rel="noopener">Deschide separat</a><button class="round" data-a="viewClose" aria-label="Închide">${ic('x',20)}</button></div>`;v.classList.add('open');
}

/* ---------- sincronizare GitHub ---------- */
const b64e=s=>{const b=new TextEncoder().encode(s);let bin='';for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(bin)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
function merge(a,b){
  const o={meta:{v:1,onboarded:!!(a.meta?.onboarded||b.meta?.onboarded)},settings:(b.settings?.updatedAt||0)>(a.settings?.updatedAt||0)?b.settings:a.settings};
  for(const c of COLS){const m=new Map();for(const x of [...(a[c]||[]),...(b[c]||[])]){const y=m.get(x.id);if(!y||(x.updatedAt||0)>(y.updatedAt||0))m.set(x.id,x)}o[c]=[...m.values()]}
  o.ecat=((b.ecat?.updatedAt||0)>(a.ecat?.updatedAt||0)?b.ecat:a.ecat)||null;
  return o;
}
const canon=o=>JSON.stringify(COLS.map(c=>[...(o[c]||[])].sort((x,y)=>x.id<y.id?-1:1)))+JSON.stringify(o.settings)+JSON.stringify(o.ecat||null);
let syncing=false,syncT=null,again=false;
function scheduleSync(){if(!SY.token||!SY.auto)return;clearTimeout(syncT);syncT=setTimeout(()=>syncNow(false),3000)}
async function syncNow(manual,retry){
  if(!SY.token||!SY.owner){if(manual)toast('Configurează sincronizarea');return}
  if(syncing){again=true;return}syncing=true;
  const url=`https://api.github.com/repos/${encodeURIComponent(SY.owner)}/${encodeURIComponent(SY.repo)}/contents/${SY.path.split('/').map(encodeURIComponent).join('/')}`;
  const H={Authorization:`Bearer ${SY.token}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  try{
    const r=await fetch(url+'?t='+Date.now(),{headers:H,cache:'no-store'});let remote=null,sha;
    if(r.status===200){const j=await r.json();sha=j.sha;remote=JSON.parse(b64d(j.content))}
    else if(r.status===401)throw new Error('cheie de acces invalidă');
    else if(r.status===404){const rr=await fetch(`https://api.github.com/repos/${encodeURIComponent(SY.owner)}/${encodeURIComponent(SY.repo)}`,{headers:H});if(rr.status===404)throw new Error('depozitul nu există sau cheia nu are acces')}
    else throw new Error('GitHub '+r.status);
    const merged=remote?merge(S,remote):S;
    const changedLocal=canon(merged)!==canon(S);
    if(changedLocal){S=merged;persist();applyTheme();refresh()}
    if(!remote||canon(merged)!==canon(remote)){
      const body={message:`Catedra · ${new Date().toISOString().slice(0,16).replace('T',' ')}`,content:b64e(JSON.stringify(merged))};if(sha)body.sha=sha;
      const p=await fetch(url,{method:'PUT',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify(body)});
      if((p.status===409||p.status===422)&&!retry){syncing=false;return syncNow(manual,true)}
      if(!p.ok)throw new Error('GitHub '+p.status);
    }
    await uploadPending();
    SY.last=Date.now();persistSync();if(manual)toast('Sincronizat');if(ui.tab==='set'&&!sheetFn)render(false);
  }catch(err){if(manual)toast('Sincronizare eșuată: '+(err.message||err))}
  finally{syncing=false;if(again){again=false;scheduleSync()}}
}

  S.classes.find(c=>c.id===ids['XII-E']).homeroom=true;
  const other=['Matematică','Limba și literatura română','Fizică','Limba engleză','Istorie','Educație fizică'];
  for(const st of S.students){if(rnd()<.5){const np=Math.floor(rnd()*5);for(let j=0;j<np;j++){let dd=addDays(today(),-Math.floor(rnd()*14));while(dow(dd)>5)dd=addDays(dd,-1);S.points.push({id:uid()+'p'+j+st.id,studentId:st.id,classId:st.classId,k:rnd()<.6?'+':'-',date:dd,used:false,updatedAt:t})}}
    if(st.classId===ids['XII-E']&&rnd()<.7){const nd=Math.floor(rnd()*4)+1;for(let j=0;j<nd;j++){let dd=addDays(today(),-Math.floor(rnd()*70)-1);while(dow(dd)>5||dayInfo(dd).kind!=='school')dd=addDays(dd,-1);const mot=rnd()<.5;const h=Math.floor(rnd()*3)+1;
      for(let k=0;k<h;k++)S.absences.push({id:uid()+'o'+j+k+st.id,studentId:st.id,classId:st.classId,date:dd,hour:null,subject:pick(other),motivated:mot,updatedAt:t})}}}
  {const xe=S.students.filter(x=>x.classId===ids['XII-E']);const mk=(i,kind,o,len,inC,note)=>{let fr=addDays(today(),-o);while(dow(fr)>5)fr=addDays(fr,-1);S.docs.push({id:uid()+'d'+i,studentId:xe[i].id,classId:ids['XII-E'],kind,from:fr,to:addDays(fr,len),received:addDays(fr,len+2),files:[],inCatalog:inC,note,updatedAt:t})};
   mk(2,'med',3,1,false,'');mk(5,'cer',8,0,false,'Competiție sportivă');mk(9,'med',20,3,true,'');mk(14,'med',30,2,true,'');mk(20,'cer',12,0,false,'Motive familiale');}
  {const rows={};for(const st of S.students.filter(x=>x.classId===ids['XII-E'])){const n=Math.floor(rnd()*rnd()*16),m=Math.floor(rnd()*14);rows[st.id]={t:n+m,n,m}}S.ecat={date:addDays(today(),-3),rows,unmatched:[],updatedAt:t};}
  ui.cls=ids['XII-E'];save();
}

  setTimeout(()=>openSheet(()=>`<div class="stack" style="text-align:center;align-items:center;padding:8px 0 4px"><img src="icons/icon-192.png" alt="" style="width:76px;height:76px;border-radius:18px">

  <div class="stack" style="width:100%;max-width:360px;gap:10px;margin-top:6px"><button class="btn pri" data-a="classEdit">Încep cu clasele mele</button><button class="btn" data-a="demo">Vreau să văd cu date de exemplu</button><button class="btn" data-a="syncEdit">Am deja date pe GitHub</button></div></div>`),400)}
setInterval(()=>{if(ui.tab==='azi'&&!sheetFn&&document.visibilityState==='visible')render(false)},20000);

if(SY.token&&SY.auto)setTimeout(()=>syncNow(false),600);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
