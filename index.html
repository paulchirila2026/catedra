<!doctype html>
<html lang="ro" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Catedra">
<meta name="theme-color" content="#0B0C10">
<script>try{if((navigator.standalone||matchMedia('(display-mode: standalone)').matches)&&Math.min(screen.width,screen.height)<760){var d=document.documentElement,f=function(){var a=screen.width,b=screen.height,h=innerHeight>innerWidth?Math.max(a,b):Math.min(a,b);d.style.setProperty('--fullh',Math.max(h,innerHeight)+'px');d.classList.add('fullh')};f();addEventListener('orientationchange',function(){setTimeout(f,300)})}}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Catedra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{
  --bg:#0B0C10;--card:#15171D;--card2:#1C1F26;--card3:#262932;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --tx:#F2F3F5;--tx2:#C4C8D0;--tx3:#9BA1AD;--tx4:#6F7582;--nav:rgba(15,16,21,.84);--shadow:0 18px 50px rgba(0,0,0,.55);
  --ac:#8B9CFF;--acs:rgba(139,156,255,.14);--onac:#0B0C10;--warn:#FFB067;
  --serif:'Instrument Serif',ui-serif,Georgia,serif;--sans:Inter,-apple-system,system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--z:1;--H:var(--fullh,100vh);
}
[data-theme=light]{
  --bg:#F3F3F6;--card:#FFFFFF;--card2:#F0F1F4;--card3:#E3E5EA;--line:rgba(10,12,20,.07);--line2:rgba(10,12,20,.12);
  --tx:#111318;--tx2:#33373F;--tx3:#5C626D;--tx4:#80868F;--nav:rgba(255,255,255,.86);--shadow:0 18px 50px rgba(20,24,40,.16);--warn:#B85A00;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;height:-webkit-fill-available}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
html,body{height:100%;position:fixed;inset:0;width:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
/* iPhone, aplicație instalată: înălțimea întregului ecran; fără position:fixed, pe care iOS îl taie la înălțimea greșită */
html.fullh,html.fullh body{position:absolute;top:0;left:0;right:0;bottom:auto;height:var(--fullh);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ac)}
.tnum{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif);font-weight:400}

/* Layout */
#app{position:relative;width:100%;height:100%;display:flex;overflow:hidden}
#fabs{position:absolute;inset:0;pointer-events:none;z-index:25}#fabs>*{pointer-events:auto}
#main{height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
#main{flex:1;min-width:0;padding:calc(var(--st) + 26px) 20px calc(max(6px, var(--sb) - 16px) + 74px)}
.wrap{max-width:1120px;margin:0 auto}
.view{animation:vin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}

/* Header */
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--tx3);text-transform:uppercase}
h1.title{margin:0;font-family:var(--serif);font-weight:400;font-size:40px;line-height:1.05;letter-spacing:-.01em}
.round{width:44px;height:44px;border-radius:22px;border:1px solid var(--line2);background:var(--card2);display:flex;align-items:center;justify-content:center;padding:0;flex:none;font-weight:600;font-size:14px}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px 20px}
.card.hero{border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:16px}
.sec{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--tx3);text-transform:uppercase;margin:6px 0 2px}
.muted{color:var(--tx3)}.dim{color:var(--tx4)}
.tag{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--acs);color:var(--ac);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tag i{width:7px;height:7px;border-radius:4px;background:var(--ac);display:block}
.tag.live i{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.bar{height:6px;border-radius:3px;background:var(--card3);overflow:hidden}
.bar>div{height:100%;border-radius:3px;background:var(--ac);transition:width .6s}
.big{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.stat b{display:block;font-size:22px;font-weight:600}
.stat b span{color:var(--tx4);font-weight:500}
.stat small{font-size:12px;color:var(--tx3)}

/* Buttons */
.btn{height:48px;border:1px solid var(--line2);border-radius:16px;background:var(--card2);font-size:15px;font-weight:600;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--ac);color:var(--onac);border-color:transparent}
.btn.sm{height:38px;border-radius:12px;font-size:14px;padding:0 14px}
.btn.danger{color:#FF6B6B}
.btn:active,.chip:active,.li:active,.key:active{transform:scale(.97)}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fab{position:absolute;right:20px;bottom:calc(max(6px, var(--sb) - 16px) + 84px);height:56px;padding:0 22px 0 18px;border:0;border-radius:28px;background:var(--ac);color:var(--onac);display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;box-shadow:var(--shadow);z-index:20}

/* Chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--tx2);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chips.fill .chip{flex:1 1 0;justify-content:center;padding:0 8px}
.chip.on{background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac);border-color:color-mix(in srgb,var(--ac) 45%,transparent)}
.chip .dot{width:8px;height:8px;border-radius:4px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:4px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.seg button{height:36px;border:0;border-radius:10px;background:transparent;color:var(--tx3);font-size:14px;font-weight:600}
.seg button.on{background:var(--card3);color:var(--tx)}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 0;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.av{width:36px;height:36px;flex:none;border-radius:18px;background:var(--card3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--tx2)}
.gchips{display:flex;gap:4px;flex-wrap:wrap}
.g{min-width:24px;height:22px;padding:0 6px;border-radius:6px;background:var(--card3);font-size:13px;font-weight:600;color:var(--tx2);display:inline-flex;align-items:center;justify-content:center}
.g.low{color:var(--warn)}
.nm{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--tx3);margin-top:3px}
.rv{font-size:20px;font-weight:600}
.pill{padding:4px 10px;border-radius:999px;background:var(--card3);font-size:12px;font-weight:600;color:var(--tx2);white-space:nowrap}

/* Schedule rows */
.sched .li{min-height:48px;gap:14px}
.sched .t{width:44px;font-size:13px;color:var(--tx3)}
.sched .done{color:var(--tx4)}
.sched .now{background:var(--acs);border-radius:14px;margin:2px -12px;padding:6px 12px;border-bottom:0;width:calc(100% + 24px)}
.sched .now .t{color:var(--ac);font-weight:600}
.mark{width:16px;display:flex;justify-content:center;flex:none}
.mark i{width:8px;height:8px;border-radius:4px;background:var(--tx4);display:block}
.mark i.o{background:transparent;border:1.5px solid var(--tx4)}

/* Events */
.ev{display:flex;gap:12px;align-items:stretch;padding:10px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.ev:last-child{border-bottom:0}
.ev .stripe{width:4px;border-radius:2px;flex:none}
.ev .when{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}

[data-theme=light] .ev .when{color:var(--tx2)!important}
/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;font-weight:700;color:var(--tx4);text-align:center;padding:4px 0;letter-spacing:.04em}
.day{position:relative;aspect-ratio:1/1.08;border:0;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7px;gap:4px;font-size:15px;font-weight:500;color:var(--tx)}
.day.out{opacity:.28}
.day.we{color:var(--tx4)}
.day.vac{background:rgba(91,211,138,.10);color:var(--tx2)}
.day.free{background:rgba(91,211,138,.18)}
.day.sel{box-shadow:inset 0 0 0 2px var(--ac)}
.day.today span{background:var(--ac);color:var(--onac);border-radius:9px;padding:0 6px;font-weight:700}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:3px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--tx3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}

/* Timetable */
.tt{display:none}
.slot{display:flex;align-items:center;gap:14px;min-height:60px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;padding:8px 0}
.slot .cbar{width:4px;align-self:stretch;border-radius:2px;flex:none}
.slot.vacant .grow{color:var(--tx4)}
.ttg{display:grid;grid-template-columns:64px repeat(5,minmax(0,1fr));gap:6px}
.ttg .h{font-size:12px;color:var(--tx3);padding:8px 0}
.ttg .c{min-height:64px;border-radius:14px;border:1px dashed var(--line2);background:transparent;text-align:left;padding:8px 10px;font-size:13px}
.ttg .c.f{border:0;background:var(--card)}

/* Nav */
nav.tabs{position:absolute;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 8px max(6px, calc(var(--sb) - 16px));background:var(--nav);border-top:1px solid var(--line);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;height:50px;color:var(--tx3);font-size:11px;font-weight:500}
nav.tabs button.on{color:var(--ac);font-weight:600}
nav .brand{display:none}

/* Sheet */
#sheet{position:absolute;inset:0;z-index:50;pointer-events:none}
#sheet.open{pointer-events:auto}
.sbg{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .25s}
#sheet.open .sbg{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:min(94dvh,calc(var(--H) * .94));overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:10px 20px calc(var(--sb) + 24px);transform:translateY(100%);transition:transform .34s cubic-bezier(.2,.9,.2,1);border-top:1px solid var(--line2)}
#sheet.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--card3);margin:0 auto 14px}
.sheet h2{margin:0;font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.1}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.lbl{font-size:12px;font-weight:600;color:var(--tx3);letter-spacing:.04em;text-transform:uppercase}
.in{height:48px;border-radius:14px;border:1px solid var(--line2);background:var(--card2);padding:0 14px;font-size:16px;width:100%;outline:none}
textarea.in{height:auto;min-height:110px;padding:12px 14px;resize:vertical}
.in:focus{border-color:var(--ac)}
select.in{appearance:none;-webkit-appearance:none}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.keys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.key{height:56px;border-radius:16px;border:1px solid var(--line2);background:var(--card2);font-size:22px;font-weight:600}
.key.low{color:var(--warn)}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw label{position:relative}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw span{display:block;width:36px;height:36px;border-radius:18px;border:3px solid transparent}
.sw input:checked+span{box-shadow:0 0 0 2px var(--tx)}
.ck{display:flex;flex-wrap:wrap;gap:8px}
.ck label{position:relative}
.ck input{position:absolute;opacity:0;pointer-events:none}
.ck span{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);font-size:14px;font-weight:600;color:var(--tx2)}
.ck input:checked+span{background:var(--tx);color:var(--bg);border-color:transparent}
.ck input:focus-visible+span,.sw input:focus-visible+span{outline:2px solid var(--ac);outline-offset:2px}
.toggle{width:52px;height:32px;border-radius:16px;border:0;background:var(--card3);position:relative;flex:none;padding:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle[aria-pressed=true]{background:var(--ac)}
.toggle[aria-pressed=true]::after{transform:translateX(20px)}
.att{display:flex;align-items:center;gap:12px;min-height:56px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:6px 0}
.att .st{font-size:13px;font-weight:700;color:var(--tx4)}
.att[aria-pressed=true] .st{color:var(--warn)}
.att[aria-pressed=true] .av{background:rgba(255,176,103,.2);color:var(--warn)}

.pm{width:44px;height:44px;flex:none;border-radius:14px;border:1px solid var(--line2);background:var(--card2);font-size:24px;font-weight:600;line-height:1;padding:0}
.pm.plus{color:#5BD38A}.pm.minus{color:var(--warn)}
.nb{display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:0;min-width:0}
nav.tabs button.wide{display:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line2);background:var(--card3);padding:0;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--tx3);font-size:11px;font-weight:600;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.missing::after{content:"?";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--tx4);font-size:18px}
.thumb.add{border-style:dashed;color:var(--ac);background:transparent}
.stchip{flex:none;height:34px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,176,103,.45);background:rgba(255,176,103,.12);color:var(--warn);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.stchip.ok{border-color:transparent;background:var(--card3);color:var(--tx3)}
#viewer{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:calc(var(--st) + 60px) 12px calc(var(--sb) + 20px)}
#viewer.open{display:flex}
#viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
#viewer .vbar{position:absolute;top:calc(var(--st) + 12px);right:12px;left:12px;display:flex;justify-content:flex-end;gap:10px;align-items:center}
#viewer .round{background:rgba(255,255,255,.12);color:#fff;border-color:transparent}
#viewer .btn{background:rgba(255,255,255,.12);color:#fff;border-color:transparent;text-decoration:none}
.ttmini{display:grid;gap:4px}
.tth{font-size:11px;font-weight:700;color:var(--tx4);text-align:center;align-self:center}
.ttc{height:44px;border-radius:9px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.1}
.ttc b{font-size:12px;font-weight:700}.ttc small{font-size:9px;color:var(--tx4)}
.ttc.e{background:transparent;border:1px dashed var(--line)}
.ttc.now{background:var(--ac);color:var(--onac)}.ttc.now small{color:var(--onac)}
/* Settings */
.set .li{min-height:52px}
.set .ico{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.empty{text-align:center;padding:28px 20px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{margin:0;color:var(--tx3);font-size:14px;line-height:1.5;max-width:320px}

#toast{position:absolute;left:50%;bottom:calc(max(6px, var(--sb) - 16px) + 90px);transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

html,body{overflow-x:hidden}
input[type=date].in,input[type=time].in{-webkit-appearance:none;appearance:none;min-width:0;display:block;text-align:left;line-height:46px}
.two>*{min-width:0}
.chip.sm{height:32px;padding:0 12px;font-size:13px}
.cchip{height:auto;min-height:44px;padding:5px 12px;flex-direction:column;align-items:flex-start;justify-content:center;gap:0;border-radius:14px;line-height:1.15}
.cchip b{font-size:14px}.cchip small{font-size:11px;opacity:.75;font-weight:600}
.statl{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--tx3)}
.statl b{color:var(--tx)}
.nowc{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px}
.nowl{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ac);text-transform:uppercase}
.nowt{font-size:19px;font-weight:600;line-height:1.2;margin-top:2px}
.ring{position:relative;width:58px;height:58px;flex:none}
.ring>div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring b{font-size:17px;font-weight:700}.ring small{font-size:9px;color:var(--tx3)}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats3 .stat{padding:10px 12px;border-radius:16px}.stats3 .stat b{font-size:17px}.stats3 .stat small{font-size:11px;line-height:1.25;display:block}
.cb{width:4px;height:26px;border-radius:2px;flex:none}
.dblk{width:44px;flex:none;text-align:center;display:flex;flex-direction:column;line-height:1.15}
.dblk span{font-size:11px;font-weight:700}.dblk b{font-size:20px;font-weight:600}
.ev{align-items:center}
.calh{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:11px;font-weight:700;color:var(--tx4);padding-bottom:6px}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cd{height:clamp(48px,calc((var(--H) - var(--st) - var(--sb) - 420px) / 6),64px);border:0;border-top:1px solid var(--line);background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0 0;color:var(--tx)}

<script>
'use strict';
/* ---------- utilitare ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);

const periods=k=>live('periods').filter(p=>!k||p.kind===k).sort((a,b)=>a.start<b.start?-1:1);
const modules=()=>periods('module');
function dayInfo(d){
  const vac=periods('vacation').find(p=>inR(d,p));if(vac)return{kind:'vacation',p:vac};
  const fr=periods('free').find(p=>inR(d,p));if(fr)return{kind:'free',p:fr};
  const fe=live('events').find(e=>e.type==='liber'&&inR(d,e));if(fe)return{kind:'free',p:{name:fe.title}};
  if(dow(d)>5)return{kind:'weekend'};
  const m=modules().find(p=>inR(d,p));if(m)return{kind:'school',p:m};
  return{kind:'out'};
}
function weekInfo(d){
  const set=new Set();for(const m of modules()){for(let x=m.start;x<=m.end;x=addDays(x,1))if(dow(x)<=5)set.add(monday(x))}
  const all=[...set].sort();const mo=monday(d);const cur=all.filter(w=>w<=mo).length;
  return{cur,total:all.length,inSchool:all.includes(mo)};
}
function modOf(d){const ms=modules();return ms.find(m=>inR(d,m))||[...ms].reverse().find(m=>m.end<d)||ms[0]}
function nextVacation(d){return periods('vacation').find(p=>p.start>d)}
function bells(){
  const b=S.settings.bells;let[h,m]=b.start.split(':').map(Number);let t=h*60+m;const out=[];
  for(let i=1;i<=b.count;i++){out.push({n:i,s:t,e:t+ +b.len});t+= +b.len+(i=== +b.bigAfter? +b.bigLen: +b.brk)}return out;
}
function lessonsOn(d){
  if(dayInfo(d).kind!=='school')return[];const B=bells();
  return live('slots').filter(s=>s.day===dow(d)).map(s=>({...s,cls:byId('classes',s.classId),b:B[s.hour-1]}))
    .filter(s=>s.b&&(!s.cls||!s.cls.terminal||d<=TERMINAL_END)).sort((a,b)=>a.hour-b.hour);
}
function eventsOn(d){return live('events').filter(e=>inR(d,e)).sort((a,b)=>a.start<b.start?-1:1)}

function applyTheme(){

  document.documentElement.dataset.theme=t;
  const a=ACCENTS[S.settings.accent]||ACCENTS.indigo;const hex=t==='light'?a[1]:a[0];
  const n=parseInt(hex.slice(1),16);const r=document.documentElement.style;
  r.setProperty('--ac',hex);r.setProperty('--acs',`rgba(${n>>16&255},${n>>8&255},${n&255},${t==='light'?.12:.15})`);
  r.setProperty('--onac',t==='light'?'#FFFFFF':'#0B0C10');
  document.querySelector('meta[name=theme-color]').content=t==='light'?'#F3F3F6':'#0B0C10';
}

function syncRoster(){let n=0;const by={};live('classes').forEach(c=>(by[c.name]=by[c.name]||[]).push(c));
  for(const k in by){const cs=by[k];if(cs.length<2)continue;const src=cs.map(c=>studentsOf(c.id)).sort((a,b)=>b.length-a.length)[0];if(!src.length)continue;

function noteProgress(){
  const W=weekInfo(today());const out=[];
  for(const c of live('classes')){const st=studentsOf(c.id);if(!st.length)continue;
    let per,exp;
    if(isPrac(c)){const L=PRACT[c.name]||[];per=L.length;exp=L.filter(n=>n<=W.cur).length;if(!per)continue}
    else{const h=+c.hpw||HPW[cShort(c)]||0;if(!h)continue;per=h+3;exp=Math.floor(per*W.cur/W.total)}

/* ---------- practică pe clase + an școlar ---------- */
const PRACT={'XI-D':[7,14,21,29,37],'XII-E':[7,14,21,29,37],'X-D':[14,29,37],'X-C':[14,29,37]};
function schoolWeeks(){const set=new Set();for(const m of modules()){for(let x=m.start;x<=m.end;x=addDays(x,1))if(dow(x)<=5)set.add(monday(x))}return[...set].sort()}
function practiceOf(mo,W){const n=W.indexOf(mo)+1;if(!n)return[];const out=[];
  for(const nm in PRACT){if(PRACT[nm].includes(n)){const c=live('classes').find(c=>c.name===nm);if(c&&c.terminal&&mo>TERMINAL_END)continue;out.push({name:nm,color:c?c.color:'#888',n})}}return out}
function yearCal(){
  const ms=modules();if(!ms.length)return '<p class="dim">Anul școlar nu are module.</p>';
  const W=schoolWeeks();const d0=today();const evs=live('events');
  const a=ms[0].start.slice(0,7),z=ms[ms.length-1].end.slice(0,7);const months=[];
  for(let [y,m]=a.split('-').map(Number);`${y}-${pad(m)}`<=z&&months.length<12;m++){if(m>12){m=1;y++}months.push([y,m])}
  const mi=x=>{const i=ms.findIndex(p=>inR(x,p));return i<0?'':'m'+(i%5+1)};
  const out=months.map(([y,m])=>{
    const first=`${y}-${pad(m)}-01`,st=monday(first);const nd=new Date(y,m,0).getDate();const rows=Math.ceil((dow(first)-1+nd)/7);let cells='';
    for(let i=0;i<rows*7;i++){const x=addDays(st,i);const inM=x.slice(0,7)===`${y}-${pad(m)}`;
      if(!inM){cells+='<button class="yd o" tabindex="-1" aria-hidden="true"></button>';continue}
      const info=dayInfo(x);const de=evs.some(e=>inR(x,e)&&e.type!=='liber');const pr=dow(x)<=5&&info.kind==='school'?practiceOf(monday(x),W):[];
      const cls=['yd',info.kind==='vacation'?'vac':info.kind==='free'?'free':info.kind==='weekend'?'we':mi(x),pr.length?'pr':'',x===ui.sel?'sel':'',x===d0?'today':''].join(' ');
      const bg=pr.length?`background:${pr.length===1?hexA(pr[0].color,.5):`linear-gradient(135deg,${pr.map((c,i)=>`${hexA(c.color,.55)} ${Math.round(i/pr.length*100)}% ${Math.round((i+1)/pr.length*100)}%`).join(',')})`}`:'';
      cells+=`<button class="${cls}" ${bg?`style="${bg}"`:''} data-a="selDay" data-d="${x}" aria-label="${fmtD(x,true)}"><span class="dn">${parse(x).getDate()}</span>${de?'<i class="ed"></i>':''}</button>`}
    const mod=ms.find(p=>p.start.slice(0,7)===`${y}-${pad(m)}`);
    return `<div class="ym"><div class="yt"><span>${LUNI[m-1]} ${m===1||m===a.slice(5,7)*1&&y===+a.slice(0,4)?y:''}</span>${mod?`<span style="color:var(--tx4)">${'M'+((mod.name.match(/\d+/)||[''])[0])}</span>`:''}</div><div class="yh">${[1,2,3,4,5,6,7].map(i=>`<div>${ZS[i]}</div>`).join('')}</div><div class="yg">${cells}</div></div>`}).join('');
  const pc=Object.keys(PRACT).map(nm=>{const c=live('classes').find(c=>c.name===nm);return c?`<span><i style="background:${hexA(c.color,.55)}"></i>practică ${esc(nm)}</span>`:''}).join('');
  const mm=['rgba(70,200,170,.4)','rgba(255,214,70,.4)','rgba(130,140,255,.45)','rgba(255,120,170,.4)','rgba(235,190,130,.4)'];
  return `<div class="yr">${out}</div><div class="ylg">${ms.slice(0,5).map((p,i)=>`<span><i style="background:${mm[i%5]}"></i>M${(p.name.match(/\d+/)||[''])[0]}</span>`).join('')}<span><i style="background:rgba(255,150,40,.45)"></i>vacanță</span><span><i style="background:rgba(255,150,40,.8)"></i>zi liberă</span>${pc}<span><i style="background:var(--ac);width:6px;height:6px;border-radius:3px"></i>eveniment</span></div>`;
}

     <button class="pm minus" data-a="pt" data-id="${r.s.id}" data-k="-" aria-label="Minus pentru ${esc(r.s.name)}">−</button><button class="pm plus" data-a="pt" data-id="${r.s.id}" data-k="+" aria-label="Plus pentru ${esc(r.s.name)}">+</button></div></div>`).join('')}</div>`
   :`<div class="card empty"><p>Clasa nu are încă elevi.</p><button class="btn pri" data-a="classEdit" data-id="${c.id}">${ic('plus',20)} Adaugă elevi</button></div>`;
  return hdr('','Catalog',`<button class="round" data-a="classEdit" data-id="${c.id}" aria-label="Editează clasa">${ic('edit',20)}</button>`)+
   `<div class="stack" style="margin-top:12px;gap:10px"><div class="chips fill">${[...new Set(cs.map(x=>x.name))].map(n=>`<button class="chip ${n===c.name?'on':''}" data-a="clsName" data-n="${esc(n)}" style="font-size:15px;height:40px">${esc(n)}</button>`).join('')}</div>
   <div class="seg" style="grid-auto-columns:minmax(0,1fr)">${cs.filter(x=>x.name===c.name).map(x=>`<button class="${x.id===c.id?'on':''}" data-a="cls" data-id="${x.id}">${esc(cShort(x))}</button>`).join('')}</div>
   <div class="statl"><span>Media <b style="color:var(--ac);font-size:15px">${cav!==null?n2(cav):'—'}</b></span><span><b>${st.length}</b> elevi</span><span><b style="color:var(--warn)">${low}</b> sub 5</span><span><b>${totA}</b> absențe</span></div>
   ${st.length?'<div class="dim" style="font-size:12px;margin-top:-4px">Glisează pe elev: spre dreapta = notă · spre stânga = absent azi</div>':''}

/* ---------- ORAR ---------- */
function vOrar(){
  const B=bells();const sl=live('slots');const W=weekInfo(today());const td=dow(today());const nm=nowMin();const school=dayInfo(today()).kind==='school';
  const hc=homeroom();const mode=hc&&hc.tt&&ui.ttMode==='cls'?'cls':'me';
  let maxH=1;
  if(mode==='me'){sl.forEach(s=>{if(s.hour>maxH)maxH=s.hour});maxH=Math.min(B.length,Math.max(maxH,6))}else maxH=Math.max(...Object.values(hc.tt.days).map(r=>r.length),1);
  const curH=B.find(b=>nm>=b.s&&nm<b.e)?.n;
  let g=`<div></div>${[1,2,3,4,5].map(i=>`<div class="tdh ${i===td?'on':''}">${ZILE[i].slice(0,2)}</div>`).join('')}`;
  for(let h=1;h<=maxH;h++){const b=B[h-1];
    g+=`<div class="trh"><b>${h}</b><small>${b?fmtT(b.s):''}</small></div>`;
    for(let d=1;d<=5;d++){const on=school&&d===td&&h===curH;
      if(mode==='me'){const s=sl.find(x=>x.day===d&&x.hour===h);const c=s&&byId('classes',s.classId);
        g+=s?`<button class="tc ${on?'now':''}" data-a="slot" data-d="${d}" data-h="${h}" style="background:${hexA(c?c.color:'#888888',.14)};--cc:${c?c.color:'#888'}"><b style="color:${c?c.color:'var(--tx)'}">${esc(s.subject||cShort(c)||'')}</b><small>${c?esc(c.name):''}</small><span class="xf n" style="color:${c?c.color:'var(--tx)'}">${c?esc((c.subject||'').replace(/^M\d+\s*[:·]\s*/,'')):esc(s.subject||'')}</span><span class="xf t">${c?esc(c.name):''}${s.room?' · sala '+esc(s.room):''}</span></button>`
           :`<button class="tc e ${d===td?'td':''}" data-a="slot" data-d="${d}" data-h="${h}" aria-label="Adaugă oră ${ZILE[d]} ora ${h}"></button>`;
      }else{const x=(hc.tt.days[d]||[])[h-1];const mine=x&&x[1]==='CP';
        g+=x?`<button class="tc ${on?'now':''}" data-a="ttInfo" data-d="${d}" data-h="${h}" style="background:${mine?hexA(hc.color,.16):'var(--card)'};--cc:${mine?hc.color:'var(--line2)'}"><b style="color:${mine?hc.color:'var(--tx)'}">${esc(x[0])}</b><small class="xc">${esc(x[1]||'')}</small><span class="xf n" style="color:${mine?hc.color:'var(--tx)'}">${esc(hc.tt.legend?.[x[0]]||x[0])}</span><span class="xf t">${x[1]==='CP'?'Chirilă Paul':esc(hc.tt.teachers?.[x[1]]||x[1]||'')}</span></button>`:`<div class="tc e ${d===td?'td':''}"></div>`;
      }}
  }
  const sw=hc&&hc.tt?`<div class="seg" style="margin-top:12px"><button class="${mode==='me'?'on':''}" data-a="ttMode" data-v="me">Orarul meu</button><button class="${mode==='cls'?'on':''}" data-a="ttMode" data-v="cls">Clasa ${esc(hc.name)}</button></div>`:'';
  const cnt=mode==='me'?sl.length:Object.values(hc.tt.days).reduce((x,r)=>x+r.filter(Boolean).length,0);
  return hdr(`Săpt. ${W.cur} / ${W.total} · ${cnt} ore`,'Orar',`<button class="round" data-a="bells" aria-label="Ore și pauze">${ic('bell',20)}</button>`)+sw+
   `<div class="ttw ttswipe ${mode==='cls'?'cls':''}" style="margin-top:12px;--rows:${maxH}">${g}</div>${mode==='cls'?`<details class="lgd" style="margin-top:12px"><summary class="muted" style="font-size:14px">Legendă · discipline și profesori</summary><div style="margin-top:6px">${(()=>{const pr={};Object.values(hc.tt.days).forEach(r=>r.forEach(x=>{if(!x)return;(pr[x[0]]=pr[x[0]]||{n:0,t:new Set()}).n++;if(x[1])pr[x[0]].t.add(x[1])}));return Object.entries(pr).sort((a,b)=>b[1].n-a[1].n).map(([k,v])=>`<div class="lg"><b>${esc(k)}</b><span>${esc(hc.tt.legend?.[k]||k)}<br><small style="text-align:left">${[...v.t].map(t=>t==='CP'?'Chirilă Paul (tu)':esc(hc.tt.teachers?.[t]||t)).join(', ')}</small></span><small>${v.n} ${v.n===1?'oră':'ore'}</small></div>`).join('')})()}</div></details>`:'<div class="dim" style="font-size:12px;margin-top:10px">Atinge o oră pentru a o modifica.</div>'}`;
}

const normName=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z ]+/g,' ').split(/\s+/).filter(x=>x.length>1).sort();
function matchStudent(name,list){

  let m=list.find(s=>normName(s.name).join(' ')===key);if(m)return m;
  const c=list.filter(s=>{const st=normName(s.name);return st.length&&st.every(x=>t.includes(x))});return c.length===1?c[0]:null;

function parseTable(text){
  const lines=text.replace(/\r/g,'').split('\n').filter(l=>l.trim());if(!lines.length)return[];
  const first=lines[0];const d=first.includes('\t')?'\t':(first.split(';').length>first.split(',').length?';':',');
  return lines.map(l=>{const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'&&l[i+1]==='"'){cur+='"';i++}else if(ch==='"')q=false;else cur+=ch}else if(ch==='"')q=true;else if(ch===d){out.push(cur.trim());cur=''}else cur+=ch}out.push(cur.trim());return out});
}
function loadXLSX(){return window.XLSX?Promise.resolve(window.XLSX):new Promise((res,rej)=>{const s=document.createElement('script');s.src='vendor/xlsx.full.min.js';s.onload=()=>res(window.XLSX);s.onerror=()=>rej(new Error('fără internet'));document.head.appendChild(s)})}
function guessMap(h){
  const f=re=>h.findIndex(x=>re.test(String(x).toLowerCase()));

  let name=f(/nume|elev|student|prenume/);if(name<0)name=0;

}
async function readImportFile(f){

function anyDate(v){const x=String(v||'').trim();let m;
  if(m=x.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  if(m=x.match(/^(\d{1,2})[./](\d{1,2})[./](\d{2,4})/)){const y=m[3].length===2?'20'+m[3]:m[3];return +m[1]>12?`${y}-${pad(+m[2])}-${pad(+m[1])}`:`${y}-${pad(+m[1])}-${pad(+m[2])}`}
  if(m=x.match(/^(\d{1,2})\.(\d{1,2})$/)){const mm=+m[2];return `${mm>=8?2026:2027}-${pad(mm)}-${pad(+m[1])}`}return null}
const normSub=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/^m\d+\s*[:·]\s*/,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
function className(lbl){const m=String(lbl||'').match(/clasa\s+a\s+([ivxl]+)-?a?\s+([a-z])/i);return m?`${m[1].toUpperCase()}-${m[2].toUpperCase()}`:String(lbl||'').trim()}
function gradeImportPlan(){
  const H=IMP.hdr.map(h=>String(h).toLowerCase());const ix=re=>H.findIndex(h=>re.test(h));
  const iE=ix(/^elev/),iN=ix(/^nota$/),iS=ix(/materie/),iD=ix(/^data$/),iC=ix(/^clasa$/),iW=ix(/cine a notat/);
  const conf=[];const me=normName(S.settings.name||'');const cls=live('classes');const plan=[];const miss={};let dup=0,other=0;
  for(const r of IMP.rows){if(!r[iE]||!r[iN])continue;const v=parseInt(r[iN]);if(!(v>=1&&v<=10))continue;
    if(String(r[iS]).trim().toLowerCase()==='purtare'){other++;continue}
    if(iW>=0&&me.length){const w=normName(r[iW]);if(!me.every(x=>w.includes(x))){other++;continue}}

const IDB={p:null,open(){return this.p||(this.p=new Promise((res,rej)=>{const r=indexedDB.open('catedra-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async tx(mode,fn){const db=await this.open();return new Promise((res)=>{const t=db.transaction('f',mode);const q=fn(t.objectStore('f'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>res(null)})},
  get(k){return this.tx('readonly',s=>s.get(k)).catch(()=>null)},set(k,v){return this.tx('readwrite',s=>s.put(v,k))},del(k){return this.tx('readwrite',s=>s.delete(k)).catch(()=>null)}};
const PKEY='catedra.pending';let PEND;try{PEND=JSON.parse(localStorage.getItem(PKEY))||[]}catch(e){PEND=[]}
const savePend=()=>{try{localStorage.setItem(PKEY,JSON.stringify(PEND))}catch(e){}};
const fpath=f=>`files/${f.id}.${f.ext}`;
const ghH=()=>({Authorization:`Bearer ${SY.token}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
const ghUrl=p=>`https://api.github.com/repos/${encodeURIComponent(SY.owner)}/${encodeURIComponent(SY.repo)}/contents/${p.split('/').map(encodeURIComponent).join('/')}`;
async function compress(file){
  try{const u=URL.createObjectURL(file);const img=new Image();await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=u});
    const k=Math.min(1,1800/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.72));return b||file}catch(e){return file}
}
async function ingest(file){
  let blob=file,ext;
  if(file.type.startsWith('image/')||/\.(heic|jpe?g|png|webp)$/i.test(file.name)){blob=await compress(file);ext=blob.type==='image/jpeg'?'jpg':(file.name.split('.').pop()||'img').toLowerCase()}
  else if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){if(file.size>8e6){toast('PDF prea mare (maximum 8 MB)');return null}ext='pdf'}
  else{toast('Se pot atașa doar poze sau PDF');return null}
  const f={id:uid(),ext,type:blob.type||(ext==='pdf'?'application/pdf':'image/jpeg'),name:file.name};
  await IDB.set(f.id,{blob,type:f.type});PEND.push(f);savePend();return f;
}
const urlCache=new Map();
async function fileURL(f){
  if(urlCache.has(f.id))return urlCache.get(f.id);
  let rec=await IDB.get(f.id);
  if(!rec&&SY.token&&SY.owner){try{const r=await fetch(ghUrl(fpath(f)),{headers:{...ghH(),Accept:'application/vnd.github.raw'},cache:'no-store'});if(r.ok){const b=await r.blob();rec={blob:new Blob([b],{type:f.type}),type:f.type};await IDB.set(f.id,rec)}}catch(e){}}
  if(!rec)return null;const u=URL.createObjectURL(rec.blob.type?rec.blob:new Blob([rec.blob],{type:f.type}));urlCache.set(f.id,u);return u;
}
function hydrate(){document.querySelectorAll('img[data-fid]:not([data-h])').forEach(async el=>{el.dataset.h='1';const u=await fileURL({id:el.dataset.fid,ext:el.dataset.ext,type:el.dataset.type});if(u)el.src=u;else el.parentElement.classList.add('missing')})}
async function uploadPending(){
  if(!PEND.length)return;
  for(const f of [...PEND]){const rec=await IDB.get(f.id);if(!rec){PEND=PEND.filter(x=>x.id!==f.id);continue}
    const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.readAsDataURL(rec.blob)});
    const p=await fetch(ghUrl(fpath(f)),{method:'PUT',headers:{...ghH(),'Content-Type':'application/json'},body:JSON.stringify({message:`Catedra · fișier ${f.id}`,content:b64})});
    if(p.ok||p.status===422){PEND=PEND.filter(x=>x.id!==f.id);savePend()}else break}
}
async function removeFiles(files){
  for(const f of files||[]){IDB.del(f.id);PEND=PEND.filter(x=>x.id!==f.id);savePend();
    if(SY.token&&SY.owner){try{const r=await fetch(ghUrl(fpath(f)),{headers:ghH()});if(r.ok){const j=await r.json();await fetch(ghUrl(fpath(f)),{method:'DELETE',headers:{...ghH(),'Content-Type':'application/json'},body:JSON.stringify({message:'Catedra · șterge fișier',sha:j.sha})})}}catch(e){}}}
}

/* ---------- sincronizare GitHub ---------- */
const b64e=s=>{const b=new TextEncoder().encode(s);let bin='';for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(bin)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
function merge(a,b){
  const o={meta:{v:1,onboarded:!!(a.meta?.onboarded||b.meta?.onboarded)},settings:(b.settings?.updatedAt||0)>(a.settings?.updatedAt||0)?b.settings:a.settings};
  for(const c of COLS){const m=new Map();for(const x of [...(a[c]||[]),...(b[c]||[])]){const y=m.get(x.id);if(!y||(x.updatedAt||0)>(y.updatedAt||0))m.set(x.id,x)}o[c]=[...m.values()]}
  o.ecat=((b.ecat?.updatedAt||0)>(a.ecat?.updatedAt||0)?b.ecat:a.ecat)||null;
  return o;
}
const canon=o=>JSON.stringify(COLS.map(c=>[...(o[c]||[])].sort((x,y)=>x.id<y.id?-1:1)))+JSON.stringify(o.settings)+JSON.stringify(o.ecat||null);
let syncing=false,syncT=null,again=false;
function scheduleSync(){if(!SY.token||!SY.auto)return;clearTimeout(syncT);syncT=setTimeout(()=>syncNow(false),3000)}
async function syncNow(manual,retry){
  if(!SY.token||!SY.owner){if(manual)toast('Configurează sincronizarea');return}
  if(syncing){again=true;return}syncing=true;
  const url=`https://api.github.com/repos/${encodeURIComponent(SY.owner)}/${encodeURIComponent(SY.repo)}/contents/${SY.path.split('/').map(encodeURIComponent).join('/')}`;
  const H={Authorization:`Bearer ${SY.token}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  try{
    const r=await fetch(url+'?t='+Date.now(),{headers:H,cache:'no-store'});let remote=null,sha;
    if(r.status===200){const j=await r.json();sha=j.sha;remote=JSON.parse(b64d(j.content))}
    else if(r.status===401)throw new Error('cheie de acces invalidă');
    else if(r.status===404){const rr=await fetch(`https://api.github.com/repos/${encodeURIComponent(SY.owner)}/${encodeURIComponent(SY.repo)}`,{headers:H});if(rr.status===404)throw new Error('depozitul nu există sau cheia nu are acces')}
    else throw new Error('GitHub '+r.status);
    const merged=remote?merge(S,remote):S;
    const changedLocal=canon(merged)!==canon(S);
    if(changedLocal){S=merged;migrate();persist();applyTheme();refresh()}
    if(!remote||canon(merged)!==canon(remote)){
      const body={message:`Catedra · ${new Date().toISOString().slice(0,16).replace('T',' ')}`,content:b64e(JSON.stringify(merged))};if(sha)body.sha=sha;
      const p=await fetch(url,{method:'PUT',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify(body)});
      if((p.status===409||p.status===422)&&!retry){syncing=false;return syncNow(manual,true)}
      if(!p.ok)throw new Error('GitHub '+p.status);
    }
    await uploadPending();
    SY.last=Date.now();persistSync();if(manual)toast('Sincronizat');if(ui.tab==='set'&&!sheetFn)render(false);
  }catch(err){if(manual)toast('Sincronizare eșuată: '+(err.message||err))}
  finally{syncing=false;if(again){again=false;scheduleSync()}}
}
